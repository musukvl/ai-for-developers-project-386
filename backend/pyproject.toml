[project]
name = "calls-calendar-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "flask>=3.1",
  "loguru>=0.7",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
lint.ignore = ["TRY004", "FURB162"]
