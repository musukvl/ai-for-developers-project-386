name: ci

on:
  push:
  pull_request:

jobs:
  typespec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - name: Compile TypeSpec and check OpenAPI drift
        working-directory: spec
        run: |
          npm ci
          npx tsp compile .
          git diff --exit-code -- openapi.yaml

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Ruff and pytest
        working-directory: backend
        run: |
          uv sync
          uv run ruff check .
          uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: uv sync
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t calls-calendar .
      - name: Container exits on SIGTERM within 10 seconds
        run: |
          cid="$(docker run -d -p 5000:5000 calls-calendar)"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/api/health >/dev/null
          docker stop -t 10 "$cid"
          code="$(docker inspect -f '{{.State.ExitCode}}' "$cid")"
          echo "container exit code: ${code}"
          if [ "${code}" = "137" ]; then
            echo "Container was SIGKILL'd after the 10s stop timeout."
            exit 1
          fi
